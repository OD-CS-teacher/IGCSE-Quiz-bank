<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Transmission Methods – Interactive Quiz</title><style>
:root{--blue:#2563eb;--navy:#172554;--line:#dbe3ef;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font:16px/1.55 Arial,sans-serif}.wrap{max-width:900px;margin:28px auto;padding:0 16px}header{background:linear-gradient(135deg,#172554,#1d4ed8);color:white;padding:26px;border-radius:18px}h1{margin:0 0 6px;font-size:26px}header p{margin:0;color:#dbeafe}.tag{display:inline-block;margin:14px 7px 0 0;padding:5px 11px;border:1px solid #ffffff55;background:#ffffff20;border-radius:20px;font-size:13px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #0f172a0a}.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}.bar{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--blue);transition:width .2s}.qhead{display:flex;justify-content:space-between;margin:19px 0 12px}.qnum{color:var(--blue);font-size:14px;font-weight:bold}.question{font-size:19px;font-weight:600;margin:12px 0 20px}.options{display:grid;gap:10px}.option{border:1px solid var(--line);border-radius:11px;padding:13px 15px;display:flex;gap:12px;cursor:pointer}.option:hover{background:#f8fbff;border-color:#93c5fd}.option.selected{border:2px solid var(--blue);background:#eff6ff;padding:12px 14px}.option.correct{border-color:#86efac;background:#f0fdf4}.option.wrong{border-color:#fca5a5;background:#fef2f2}.letter{font-weight:bold;color:var(--blue);min-width:22px}.feedback{display:none;margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#f8fafc}.feedback.show{display:block}.feedback.good{background:#f0fdf4;border-color:#bbf7d0}.feedback.note{background:#fff7ed;border-color:#fed7aa}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:bold;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--blue);color:white}.secondary{background:#e2e8f0;color:#1e293b}.check{background:#0f766e;color:white}.result{text-align:center}.score{font-size:42px;font-weight:800;color:var(--navy)}.review{text-align:left;border-top:1px solid var(--line);padding:14px 0}.small{font-size:13px;color:var(--muted)}@media(max-width:600px){.panel{padding:17px}h1{font-size:22px}.question{font-size:17px}.controls button{flex:1}}</style></head><body><div class="wrap">
<header><h1>Data Transmission Methods</h1><p>Cambridge IGCSE Topic 2.1 · Data Transmission Methods</p><span class="tag">6 questions</span><span class="tag">Multiple choice</span><span class="tag">Instant feedback</span></header>
<section class="panel" id="quiz"><div class="progress"><span id="progress">Question 1 of 6</span><span id="answered">Answered: 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="qhead"><span class="qnum" id="qnum">QUESTION 1</span><span class="small">1 mark</span></div><div class="question" id="question"></div><div id="area"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="secondary" id="prev">← Previous</button><div style="display:flex;gap:9px"><button class="check" id="check">Check answer</button><button class="primary" id="next">Next →</button></div></div></section>
<section class="panel result" id="result" style="display:none"></section><p class="small" style="text-align:center;margin:18px 0">Based on the uploaded PDF: Free Printable CAMBRIDGE IGCSE Topic 2.1 Data transmission methods.</p></div>
<script>
const questions=[{"q": "Parallel data transmission would most likely be used for?", "opts": ["Sending data to a printer", "Saving work on a USB Flash Drive", "Streaming a movie", "Sending an email"], "a": 0, "why": "The worksheet gives sending data to a printer as the likely example of parallel transmission."}, {"q": "In a half duplex transmission two way communication is possible, it is not possible to transmit in both directions at the same time.", "opts": ["TRUE", "FALSE"], "a": 0, "why": "Half duplex allows two-way communication, but the two directions take turns."}, {"q": "Full Duplex transmission is where:", "opts": ["Data can only be transmitted in one direction", "Data can be transmitted in one direction at a time", "Data can be sent both ways at the same time", "A made up term to confuse us"], "a": 2, "why": "Full duplex allows data to be sent in both directions simultaneously."}, {"q": "Simplex transmission is where:", "opts": ["Data can only be transmitted in one direction", "Data can be transmitted in one direction at a time", "Data can be sent both ways at the same time", "A made up term to confuse us"], "a": 0, "why": "Simplex transmission is one-way only."}, {"q": "Parallel transmission is where", "opts": ["1 bit is transmitted at a time", "Data can only be transmitted in one direction at a time", "8 bits are transmitted at the same time", "8 elephants are ridden at the same time"], "a": 2, "why": "Parallel transmission sends multiple bits simultaneously using separate channels."}, {"q": "Why is parallel data transmission faster than serial data transmission?", "opts": ["Because multiple channels are used in parallel data transmission", "Because multiple bits are sent over a single channel in parallel data transmission", "Because data might be skewed in serial data transmission slowing the rate of transmission", "None of the other answers are correct"], "a": 0, "why": "Parallel transmission uses multiple channels so several bits can be sent at the same time."}];
questions.forEach(q=>{q.shuffled=q.opts.map((t,i)=>({t,correct:i===q.a}));for(let i=q.shuffled.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[q.shuffled[i],q.shuffled[j]]=[q.shuffled[j],q.shuffled[i]]}});
let index=0,answers=Array(questions.length).fill(null),checked=Array(questions.length).fill(false);const $=id=>document.getElementById(id);
function render(){let q=questions[index];$("progress").textContent=`Question ${index+1} of ${questions.length}`;$("answered").textContent=`Answered: ${answers.filter(v=>v!==null).length}`;$("fill").style.width=((index+1)/questions.length*100)+"%";$("qnum").textContent=`QUESTION ${index+1}`;$("question").textContent=q.q;let area=$("area");area.innerHTML="";let list=document.createElement("div");list.className="options";q.shuffled.forEach((o,i)=>{let el=document.createElement("div");el.className="option"+(answers[index]===i?" selected":"");if(checked[index])el.className+=" "+(o.correct?"correct":answers[index]===i?"wrong":"");el.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}.</span><span></span>`;el.children[1].textContent=o.t;el.onclick=()=>{if(!checked[index]){answers[index]=i;render()}};list.appendChild(el)});area.appendChild(list);let fb=$("feedback");fb.className="feedback"+(checked[index]?" show":"");fb.innerHTML="";if(checked[index]){let c=q.shuffled.findIndex(o=>o.correct),ok=answers[index]===c;fb.classList.add(ok?"good":"note");fb.innerHTML=`<h3>${ok?"Correct!":"Review the correct answer."}</h3><p><b>Correct answer: ${q.shuffled[c].t}</b></p><p>${q.why}</p>`}$("prev").disabled=index===0;$("next").textContent=index===questions.length-1?"Finish →":"Next →";$("check").disabled=checked[index];$("check").textContent=checked[index]?"Checked":"Check answer"}
$("prev").onclick=()=>{if(index>0){index--;render()}};$("next").onclick=()=>{if(index<questions.length-1){index++;render()}else results()};$("check").onclick=()=>{if(answers[index]===null){alert("Please select an answer first.");return}checked[index]=true;render()};
function results(){$("quiz").style.display="none";let r=$("result");r.style.display="block";let score=0;questions.forEach((q,i)=>{if(checked[i]&&q.shuffled[answers[i]]?.correct)score++});let out=`<h2>Quiz completed!</h2><div class="score">${score} / ${questions.length}</div><p>Your score</p><p class="small">Answered ${answers.filter(v=>v!==null).length} of ${questions.length} questions.</p><hr>`;questions.forEach((q,i)=>{let c=q.shuffled.findIndex(o=>o.correct),ok=answers[i]!==null&&q.shuffled[answers[i]].correct;out+=`<div class="review"><b>Q${i+1} · ${ok?"Correct":"Review"}</b><p>${q.q}</p><p>Your answer: ${answers[i]===null?"Not answered":q.shuffled[answers[i]].t}<br>Correct answer: ${q.shuffled[c].t}</p><p>${q.why}</p></div>`});out+=`<button class="primary" onclick="location.reload()">Retake quiz</button>`;r.innerHTML=out}render();
</script></body></html>
