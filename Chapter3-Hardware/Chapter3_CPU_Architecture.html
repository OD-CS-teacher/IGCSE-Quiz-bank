<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGCSE 0478 Chapter 3 – CPU Architecture Quiz</title>
<style>
:root{--blue:#2563eb;--navy:#172554;--line:#dbe3ef;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font:16px/1.55 Arial,sans-serif}.wrap{max-width:920px;margin:26px auto;padding:0 16px}header{background:linear-gradient(135deg,#172554,#1d4ed8);color:white;padding:26px;border-radius:18px}h1{margin:0 0 6px;font-size:26px}header p{margin:0;color:#dbeafe}.tag{display:inline-block;margin:14px 7px 0 0;padding:5px 11px;border:1px solid #ffffff55;background:#ffffff20;border-radius:20px;font-size:13px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #0f172a0a}.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}.bar{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--blue);transition:width .2s}.qhead{display:flex;justify-content:space-between;margin:19px 0 12px}.qnum{color:var(--blue);font-size:14px;font-weight:bold}.question{font-size:19px;font-weight:600;white-space:pre-line;margin:12px 0 20px}.options{display:grid;gap:10px}.option{border:1px solid var(--line);border-radius:11px;padding:13px 15px;display:flex;gap:12px;cursor:pointer}.option:hover{background:#f8fbff;border-color:#93c5fd}.option.selected{border:2px solid var(--blue);background:#eff6ff;padding:12px 14px}.option.correct{border-color:#86efac;background:#f0fdf4}.option.wrong{border-color:#fca5a5;background:#fef2f2}.letter{font-weight:bold;color:var(--blue);min-width:22px}textarea{width:100%;min-height:145px;padding:13px;border:1px solid #cbd5e1;border-radius:11px;font:16px/1.5 Arial;resize:vertical}.feedback{display:none;margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#f8fafc}.feedback.show{display:block}.feedback.good{background:#f0fdf4;border-color:#bbf7d0}.feedback.note{background:#fff7ed;border-color:#fed7aa}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:bold;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--blue);color:white}.secondary{background:#e2e8f0;color:#1e293b}.check{background:#0f766e;color:white}.result{text-align:center}.score{font-size:42px;font-weight:800;color:var(--navy)}.review{text-align:left;border-top:1px solid var(--line);padding:14px 0}.small{font-size:13px;color:var(--muted)}@media(max-width:600px){.panel{padding:17px}h1{font-size:22px}.question{font-size:17px}.controls button{flex:1}}
</style></head><body><div class="wrap"><header><h1>CPU Architecture – Exam Practice</h1><p>Cambridge IGCSE Computer Science 0478 · Chapter 3</p><span class="tag">8 exam-style questions</span><span class="tag">5 MCQ + 3 written</span><span class="tag">Instant feedback</span></header>
<section class="panel" id="quiz"><div class="progress"><span id="progress"></span><span id="answered">Answered: 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="qhead"><span class="qnum" id="qnum"></span><span class="small" id="qtype"></span></div><div class="question" id="question"></div><div id="area"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="secondary" id="prev">← Previous</button><div style="display:flex;gap:9px"><button class="check" id="check">Check answer</button><button class="primary" id="next">Next →</button></div></div></section>
<section class="panel result" id="result" style="display:none"></section><p class="small" style="text-align:center;margin:18px 0">Written responses are for self-assessment against the model answers; equivalent wording may also be correct. The final score counts MCQs only.</p></div>
<script>
const questions=[{"q": "Which statement best describes the Von Neumann model?", "type": "mcq", "opts": ["Program instructions and data are stored in separate main memories.", "Program instructions and data are stored in the same main memory and processed by the CPU.", "The CPU stores all programs permanently and does not need main memory.", "Input and output devices process instructions instead of the CPU."], "correct": 1, "why": "In the Von Neumann architecture, program instructions and data are stored in the same main memory and processed by the CPU."}, {"q": "What is meant by the stored program concept?", "type": "mcq", "opts": ["Program instructions are stored in the same main memory as data.", "Programs are stored only in secondary storage while they are being executed.", "The CPU stores instructions permanently in the ALU.", "Data is stored in registers, but instructions are stored in input devices."], "correct": 0, "why": "The stored program concept means that program instructions are stored in the same main memory as data."}, {"q": "Which register stores the address of the next instruction to be fetched from memory?", "type": "mcq", "opts": ["Memory Address Register (MAR)", "Current Instruction Register (CIR)", "Program Counter (PC)", "Accumulator (ACC)"], "correct": 2, "why": "The Program Counter (PC) stores the address of the next instruction to be fetched from memory."}, {"q": "A CPU is about to read the instruction stored at memory address 100. Which register stores the address 100, and which register stores the instruction after it is transferred from memory?", "type": "mcq", "opts": ["MAR stores 100; MDR stores the instruction.", "MDR stores 100; MAR stores the instruction.", "PC stores 100; ACC stores the instruction.", "CIR stores 100; PC stores the instruction."], "correct": 0, "why": "The MAR stores the memory address being accessed. The MDR stores the data or instruction being transferred to or from memory."}, {"q": "Which statement about the system buses is correct?", "type": "mcq", "opts": ["The address bus is bidirectional and carries data or instructions.", "The data bus is unidirectional and carries memory addresses.", "The control bus carries only data values between the CPU and memory.", "The address bus is unidirectional; the data bus and control bus are bidirectional."], "correct": 3, "why": "The address bus is unidirectional and carries addresses. The data bus is bidirectional and carries data or instructions. The control bus is bidirectional and carries commands and control signals."}, {"q": "State the purpose of each of the following components inside the CPU:\n(a) ALU\n(b) Control Unit (CU)\n(c) Registers", "type": "text", "answer": "(a) The ALU performs arithmetic and logical operations. (b) The Control Unit controls and coordinates the operation of the CPU, including sending control signals. (c) Registers are small, high-speed storage locations inside the CPU used to temporarily store data, instructions or addresses.", "why": "The material identifies the ALU as the Arithmetic and Logic Unit, the CU as the Control Unit, and registers as small units of temporary memory inside the CPU."}, {"q": "A computer is executing the instruction LOAD 100. Memory location 100 contains the value 25.\nDescribe the roles of the MAR, MDR and CIR during this operation.", "type": "text", "answer": "The MAR stores the address of the memory location to be accessed (100). The MDR stores the instruction or data being transferred; it receives the instruction/data from memory. The CIR stores the current instruction being decoded and executed, so the instruction is transferred from the MDR to the CIR.", "why": "The MAR holds the address of the memory location the CPU wants to access. The MDR holds data or an instruction transferred to or from memory. The CIR holds the instruction currently being decoded and executed."}, {"q": "Describe the function of each of the three types of bus in a Von Neumann architecture. Include the direction of data transfer for each bus.", "type": "text", "answer": "The address bus carries memory addresses and is unidirectional. The data bus carries data or instructions and is bidirectional. The control bus carries commands and control signals, such as signals for read and write operations, and is bidirectional.", "why": "The address bus carries location information in one direction. The data bus transfers data or instructions in both directions. The control bus transfers commands and control signals in both directions."}];
questions.forEach(q=>{if(q.type==="mcq"){q.shuffled=q.opts.map((t,i)=>({t,correct:i===q.correct}));for(let i=q.shuffled.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[q.shuffled[i],q.shuffled[j]]=[q.shuffled[j],q.shuffled[i]]}}});
let index=0,answers=Array(questions.length).fill(null),checked=Array(questions.length).fill(false);const $=id=>document.getElementById(id);
function isCorrect(q,a){return q.type==="mcq"&&q.shuffled[a]?.correct===true}
function render(){let q=questions[index];$("progress").textContent=`Question ${index+1} of ${questions.length}`;$("answered").textContent=`Answered: ${answers.filter(v=>v!==null&&v!=="").length}`;$("fill").style.width=((index+1)/questions.length*100)+"%";$("qnum").textContent=`QUESTION ${index+1}`;$("question").textContent=q.q;$("qtype").textContent=q.type==="mcq"?"1 mark · Multiple choice":"Written response";let area=$("area");area.innerHTML="";
if(q.type==="mcq"){let list=document.createElement("div");list.className="options";q.shuffled.forEach((o,i)=>{let el=document.createElement("div");el.className="option"+(answers[index]===i?" selected":"");if(checked[index])el.className+=" "+(o.correct?"correct":answers[index]===i?"wrong":"");el.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}.</span><span></span>`;el.children[1].textContent=o.t;el.onclick=()=>{if(!checked[index]){answers[index]=i;render()}};list.appendChild(el)});area.appendChild(list)}
else{let ta=document.createElement("textarea");ta.placeholder="Write your answer here...";ta.value=answers[index]||"";ta.disabled=checked[index];ta.oninput=()=>{answers[index]=ta.value;$("answered").textContent=`Answered: ${answers.filter(v=>v!==null&&v!=="").length}`};area.appendChild(ta);let hint=document.createElement("p");hint.className="small";hint.textContent="Write your response first, then select Check answer to reveal the model answer and explanation.";area.appendChild(hint)}
let fb=$("feedback");fb.className="feedback"+(checked[index]?" show":"");fb.innerHTML="";if(checked[index]){let ok=isCorrect(q,answers[index]);fb.classList.add(ok?"good":"note");fb.innerHTML=`<h3>${q.type==="mcq"?(ok?"Correct!":"Not quite – review the answer."):"Model answer"}</h3><p><b>${q.type==="mcq"?"Correct answer:":"Suggested answer:"}</b> ${q.type==="mcq"?q.shuffled.find(o=>o.correct).t:q.answer}</p><p>${q.why}</p>`}
$("prev").disabled=index===0;$("next").textContent=index===questions.length-1?"Finish →":"Next →";$("check").disabled=checked[index];$("check").textContent=checked[index]?"Checked":"Check answer"}
$("prev").onclick=()=>{if(index>0){index--;render()}};$("next").onclick=()=>{if(index<questions.length-1){index++;render()}else results()};$("check").onclick=()=>{if(answers[index]===null||String(answers[index]).trim()===""){alert(questions[index].type==="mcq"?"Please select an answer first.":"Please write an answer first.");return}checked[index]=true;render()};
function results(){$("quiz").style.display="none";let r=$("result");r.style.display="block";let score=0,mc=questions.filter(q=>q.type==="mcq").length;questions.forEach((q,i)=>{if(q.type==="mcq"&&checked[i]&&isCorrect(q,answers[i]))score++});let out=`<h2>Quiz completed!</h2><div class="score">${score} / ${mc}</div><p>MCQ score only. Written answers are provided for self-review.</p><p class="small">Answered ${answers.filter(v=>v!==null&&v!=="").length} of ${questions.length} questions.</p><hr>`;questions.forEach((q,i)=>{let expected=q.type==="mcq"?q.shuffled.find(o=>o.correct).t:q.answer;let yours=q.type==="mcq"?(answers[i]===null?"Not answered":q.shuffled[answers[i]].t):(answers[i]??"Not answered");let status=q.type==="mcq"?(answers[i]!==null&&isCorrect(q,answers[i])?"Correct":"Review"):"Written response – self-check";out+=`<div class="review"><b>Q${i+1} · ${status}</b><p>${q.q}</p><p><b>Your answer:</b> ${yours}</p><p><b>${q.type==="mcq"?"Correct answer:":"Model answer:"}</b> ${expected}</p><p>${q.why}</p></div>`});out+=`<button class="primary" onclick="location.reload()">Retake quiz</button>`;r.innerHTML=out}render();
</script></body></html>
