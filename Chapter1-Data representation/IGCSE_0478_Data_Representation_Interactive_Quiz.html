<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Representation Interactive Quiz</title>
<style>
:root{--blue:#2563eb;--navy:#172554;--line:#dbe3ef;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font:16px/1.55 Arial,sans-serif}.wrap{max-width:920px;margin:26px auto;padding:0 16px}header{background:linear-gradient(135deg,#172554,#1d4ed8);color:white;padding:26px;border-radius:18px}h1{margin:0 0 6px;font-size:26px}header p{margin:0;color:#dbeafe}.tag{display:inline-block;margin:14px 7px 0 0;padding:5px 11px;border:1px solid #ffffff55;background:#ffffff20;border-radius:20px;font-size:13px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #0f172a0a}.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}.bar{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--blue);transition:width .2s}.qhead{display:flex;justify-content:space-between;margin:19px 0 12px}.qnum{color:var(--blue);font-size:14px;font-weight:bold}.question{font-size:19px;font-weight:600;white-space:pre-line;margin:12px 0 20px}.options{display:grid;gap:10px}.option{border:1px solid var(--line);border-radius:11px;padding:13px 15px;display:flex;gap:12px;cursor:pointer}.option:hover{background:#f8fbff;border-color:#93c5fd}.option.selected{border:2px solid var(--blue);background:#eff6ff;padding:12px 14px}.option.correct{border-color:#86efac;background:#f0fdf4}.option.wrong{border-color:#fca5a5;background:#fef2f2}.letter{font-weight:bold;color:var(--blue);min-width:22px}textarea{width:100%;min-height:105px;padding:13px;border:1px solid #cbd5e1;border-radius:11px;font:16px/1.5 Arial;resize:vertical}.feedback{display:none;margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#f8fafc}.feedback.show{display:block}.feedback.good{background:#f0fdf4;border-color:#bbf7d0}.feedback.note{background:#fff7ed;border-color:#fed7aa}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:bold;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--blue);color:white}.secondary{background:#e2e8f0;color:#1e293b}.check{background:#0f766e;color:white}.result{text-align:center}.score{font-size:42px;font-weight:800;color:var(--navy)}.review{text-align:left;border-top:1px solid var(--line);padding:14px 0}.small{font-size:13px;color:var(--muted)}@media(max-width:600px){.panel{padding:17px}h1{font-size:22px}.question{font-size:17px}.controls button{flex:1}}
</style></head><body><div class="wrap"><header><h1>Data Representation</h1><p>Cambridge IGCSE Computer Science 0478 · Data Representation</p><span class="tag">18 questions</span><span class="tag">Instant feedback</span><span class="tag">Progress & review</span></header>
<section class="panel" id="quiz"><div class="progress"><span id="progress">Question 1 of 18</span><span id="answered">Answered: 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="qhead"><span class="qnum" id="qnum">QUESTION 1</span><span class="small" id="qtype"></span></div><div class="question" id="question"></div><div id="area"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="secondary" id="prev">← Previous</button><div style="display:flex;gap:9px"><button class="check" id="check">Check answer</button><button class="primary" id="next">Next →</button></div></div></section>
<section class="panel result" id="result" style="display:none"></section><p class="small" style="text-align:center;margin:18px 0">Based on the uploaded Data Representation worksheet (18 questions).</p></div>
<script>
const questions=[{"q": "The following is a correct order of units of storage from lowest to highest:", "type": "mcq", "opts": ["a bit, a nibble, a byte, a kilobyte, a megabyte, a gigabyte, a terabyte", "a bit, a byte, a nibble, a kilobyte, a megabyte, a gigabyte, a terabyte", "a bit, a nibble, a byte, a megabyte, a kilobyte, a gigabyte, a terabyte", "a byte, a bit, a nibble, a megabyte, a kilobyte, a gigabyte, a terabyte"], "correct": 0, "why": "A bit is smaller than a nibble (4 bits), which is smaller than a byte (8 bits), followed by KB, MB, GB and TB."}, {"q": "Quality of an image depends on:", "type": "mcq", "opts": ["Resolution", "Metadata", "Screen size", "Computer's speed"], "correct": 0, "why": "Image resolution affects the level of detail in a bitmap image."}, {"q": "Colour depth refers to:", "type": "mcq", "opts": ["How many bits are used in a file to store colour information in every pixel", "Resolution divided by the number of colours in an image", "Degree of file compression applied to an image file", "Repeated resampling of an image"], "correct": 0, "why": "Colour depth is the number of bits used to represent the colour of each pixel."}, {"q": "The smallest unit of data stored in an image file is called:", "type": "mcq", "opts": ["Pixels", "Resolution", "Alpha", "Bitmap"], "correct": 0, "why": "A bitmap image is made up of pixels; each pixel represents a picture element."}, {"q": "A vector image is created using:", "type": "mcq", "opts": ["Coloured pixels", "Dots", "Images", "Mathematical formulas"], "correct": 3, "why": "Vector graphics use mathematical descriptions of shapes, lines and curves."}, {"q": "Bitmap graphics are made up of:", "type": "mcq", "opts": ["Dots", "Images", "Mathematical formulas", "Coloured pixels"], "correct": 3, "why": "Bitmap graphics are made from a grid of coloured pixels."}, {"q": "The resolution of an image refers to the quality of the image.", "type": "mcq", "opts": ["TRUE", "FALSE"], "correct": 0, "why": "The worksheet treats resolution as a measure related to image quality. More pixels can provide more detail."}, {"q": "A character set is...", "type": "mcq", "opts": ["What language can be used in a computer system", "The fonts that a computer has installed", "The possible characters that can be represented by a computer system"], "correct": 2, "why": "A character set is the collection of characters a computer system can represent."}, {"q": "The (standard) ASCII code is capable of representing non-European languages.", "type": "mcq", "opts": ["True", "False"], "correct": 1, "why": "Standard ASCII uses 7 bits and represents 128 characters; it does not cover all non-European scripts."}, {"q": "What is the maximum number of values that can be represented in 8 bits?", "type": "mcq", "opts": ["255", "256", "65,536", "128"], "correct": 1, "why": "Eight bits represent 2^8 = 256 distinct values (0 to 255)."}, {"q": "Reducing the amount of colours in the image will:", "type": "mcq", "opts": ["Reduce the quality of the image", "Reduce the amount of binary needed for each pixel", "Make the file size larger", "Remove pixels from the image"], "correct": 1, "why": "Fewer available colours require a lower colour depth, so fewer bits may be needed per pixel."}, {"q": "How many colours can be used for each pixel if the colour depth is 4 bit?", "type": "mcq", "opts": ["4 colours", "5 colours", "15 colours", "16 colours"], "correct": 3, "why": "2^4 = 16 possible colour values."}, {"q": "How many colours can be used for each pixel if the colour depth is 8 bit?", "type": "mcq", "opts": ["8 colours", "9 colours", "255 colours", "256 colours"], "correct": 3, "why": "2^8 = 256 possible colour values."}, {"q": "The binary code for each pixel is used to determine:", "type": "mcq", "opts": ["Which colour will be displayed", "How big the image is", "What shape the image is", "How many pixels will be in the image"], "correct": 0, "why": "The pixel's binary code identifies the colour value to display for that pixel."}, {"q": "Which is NOT an effect of increasing the resolution in an image?", "type": "mcq", "opts": ["More colours can be displayed", "More binary will be required to create the image", "Larger file size", "Higher quality image"], "correct": 0, "why": "Increasing resolution increases the number of pixels and usually file size/detail. Colour depth controls the number of colours."}, {"q": "How could you reduce the file size of an image?", "type": "mcq", "opts": ["Reduce the number of colours used per pixel (colour depth)", "Reduce the dimensions of the image", "Compress the file using a lossy compression file type", "All of these"], "correct": 3, "why": "All three methods can reduce the amount of data stored in an image."}, {"q": "What would be the colour depth of an image which can use up to 256 colours?", "type": "mcq", "opts": ["256 bit", "8 bit", "8 byte", "256 byte"], "correct": 1, "why": "256 colours require 8 bits because 2^8 = 256."}, {"q": "Define the term \"Colour Depth\".", "type": "mcq", "opts": ["The number of bits used per pixel (BPP)", "The number of colours used in an image", "The number of pixels per inch (PPI)", "The total number of pixels in an image"], "correct": 0, "why": "Colour depth is the number of bits used to represent the colour of each pixel."}];
questions.forEach(q=>{if(q.type==="mcq"){q.shuffled=q.opts.map((t,i)=>({t,correct:i===q.correct}));for(let i=q.shuffled.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[q.shuffled[i],q.shuffled[j]]=[q.shuffled[j],q.shuffled[i]]}}});
let index=0,answers=Array(questions.length).fill(null),checked=Array(questions.length).fill(false);const $=id=>document.getElementById(id);
function norm(s){return String(s??"").trim().toLowerCase().replace(/₂/g,"2").replace(/\s+/g," ").replace(/[^a-z0-9 ]/g,"")}
function isCorrect(q,a){if(q.type==="mcq")return q.shuffled[a]?.correct===true;return (q.answer||[]).some(x=>norm(x)===norm(a))}
function render(){let q=questions[index];$("progress").textContent=`Question ${index+1} of ${questions.length}`;$("answered").textContent=`Answered: ${answers.filter(v=>v!==null&&v!=="").length}`;$("fill").style.width=((index+1)/questions.length*100)+"%";$("qnum").textContent=`QUESTION ${index+1}`;$("question").textContent=q.q;$("qtype").textContent=q.type==="mcq"?"Multiple choice":"Written answer";let area=$("area");area.innerHTML="";
if(q.type==="mcq"){let list=document.createElement("div");list.className="options";q.shuffled.forEach((o,i)=>{let el=document.createElement("div");el.className="option"+(answers[index]===i?" selected":"");if(checked[index])el.className+=" "+(o.correct?"correct":answers[index]===i?"wrong":"");el.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}.</span><span></span>`;el.children[1].textContent=o.t;el.onclick=()=>{if(!checked[index]){answers[index]=i;render()}};list.appendChild(el)});area.appendChild(list)}
else{let ta=document.createElement("textarea");ta.placeholder="Type your answer here...";ta.value=answers[index]||"";ta.disabled=checked[index];ta.oninput=()=>{answers[index]=ta.value;$("answered").textContent=`Answered: ${answers.filter(v=>v!==null&&v!=="").length}`};area.appendChild(ta);let hint=document.createElement("p");hint.className="small";hint.textContent="Enter your answer, then select Check answer to see the expected answer and explanation.";area.appendChild(hint)}
let fb=$("feedback");fb.className="feedback"+(checked[index]?" show":"");fb.innerHTML="";if(checked[index]){let ok=isCorrect(q,answers[index]);fb.classList.add(ok?"good":"note");let expected=q.type==="mcq"?q.shuffled.find(o=>o.correct).t:q.answer.join(" / ");fb.innerHTML=`<h3>${ok?"Correct!":"Review the expected answer."}</h3><p><b>Expected answer: ${expected}</b></p><p>${q.why}</p>`}
$("prev").disabled=index===0;$("next").textContent=index===questions.length-1?"Finish →":"Next →";$("check").disabled=checked[index];$("check").textContent=checked[index]?"Checked":"Check answer"}
$("prev").onclick=()=>{if(index>0){index--;render()}};$("next").onclick=()=>{if(index<questions.length-1){index++;render()}else results()};$("check").onclick=()=>{if(answers[index]===null||String(answers[index]).trim()===""){alert(questions[index].type==="mcq"?"Please select an answer first.":"Please enter an answer first.");return}checked[index]=true;render()};
function results(){$("quiz").style.display="none";let r=$("result");r.style.display="block";let score=0;questions.forEach((q,i)=>{if(checked[i]&&isCorrect(q,answers[i]))score++});let out=`<h2>Quiz completed!</h2><div class="score">${score} / ${questions.length}</div><p>Auto-marked answers. Review the explanations below.</p><p class="small">Answered ${answers.filter(v=>v!==null&&v!=="").length} of ${questions.length} questions.</p><hr>`;questions.forEach((q,i)=>{let ok=answers[i]!==null&&isCorrect(q,answers[i]);let expected=q.type==="mcq"?q.shuffled.find(o=>o.correct).t:q.answer.join(" / ");let yours=q.type==="mcq"?(answers[i]===null?"Not answered":q.shuffled[answers[i]].t):(answers[i]??"Not answered");out+=`<div class="review"><b>Q${i+1} · ${ok?"Correct":"Review"}</b><p>${q.q}</p><p>Your answer: ${yours}<br>Expected answer: ${expected}</p><p>${q.why}</p></div>`});out+=`<button class="primary" onclick="location.reload()">Retake quiz</button>`;r.innerHTML=out}render();
</script></body></html>
