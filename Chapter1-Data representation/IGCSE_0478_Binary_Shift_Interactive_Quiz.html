<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary Shift Interactive Quiz</title>
<style>
:root{--blue:#2563eb;--navy:#172554;--line:#dbe3ef;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font:16px/1.55 Arial,sans-serif}.wrap{max-width:920px;margin:26px auto;padding:0 16px}header{background:linear-gradient(135deg,#172554,#1d4ed8);color:white;padding:26px;border-radius:18px}h1{margin:0 0 6px;font-size:26px}header p{margin:0;color:#dbeafe}.tag{display:inline-block;margin:14px 7px 0 0;padding:5px 11px;border:1px solid #ffffff55;background:#ffffff20;border-radius:20px;font-size:13px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:18px;box-shadow:0 5px 20px #0f172a0a}.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px}.bar{height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--blue);transition:width .2s}.qhead{display:flex;justify-content:space-between;margin:19px 0 12px}.qnum{color:var(--blue);font-size:14px;font-weight:bold}.question{font-size:19px;font-weight:600;white-space:pre-line;margin:12px 0 20px}.options{display:grid;gap:10px}.option{border:1px solid var(--line);border-radius:11px;padding:13px 15px;display:flex;gap:12px;cursor:pointer}.option:hover{background:#f8fbff;border-color:#93c5fd}.option.selected{border:2px solid var(--blue);background:#eff6ff;padding:12px 14px}.option.correct{border-color:#86efac;background:#f0fdf4}.option.wrong{border-color:#fca5a5;background:#fef2f2}.letter{font-weight:bold;color:var(--blue);min-width:22px}textarea{width:100%;min-height:105px;padding:13px;border:1px solid #cbd5e1;border-radius:11px;font:16px/1.5 Arial;resize:vertical}.feedback{display:none;margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#f8fafc}.feedback.show{display:block}.feedback.good{background:#f0fdf4;border-color:#bbf7d0}.feedback.note{background:#fff7ed;border-color:#fed7aa}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:bold;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--blue);color:white}.secondary{background:#e2e8f0;color:#1e293b}.check{background:#0f766e;color:white}.result{text-align:center}.score{font-size:42px;font-weight:800;color:var(--navy)}.review{text-align:left;border-top:1px solid var(--line);padding:14px 0}.small{font-size:13px;color:var(--muted)}@media(max-width:600px){.panel{padding:17px}h1{font-size:22px}.question{font-size:17px}.controls button{flex:1}}
</style></head><body><div class="wrap"><header><h1>Binary Shift</h1><p>Cambridge IGCSE Computer Science 0478 · Binary Shift</p><span class="tag">26 questions</span><span class="tag">Instant feedback</span><span class="tag">Progress & review</span></header>
<section class="panel" id="quiz"><div class="progress"><span id="progress">Question 1 of 26</span><span id="answered">Answered: 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="qhead"><span class="qnum" id="qnum">QUESTION 1</span><span class="small" id="qtype"></span></div><div class="question" id="question"></div><div id="area"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="secondary" id="prev">← Previous</button><div style="display:flex;gap:9px"><button class="check" id="check">Check answer</button><button class="primary" id="next">Next →</button></div></div></section>
<section class="panel result" id="result" style="display:none"></section><p class="small" style="text-align:center;margin:18px 0">Based on the uploaded BINARY SHIFT worksheet (26 questions). Written binary answers are checked against the expected worksheet answer.</p></div>
<script>
const questions=[{"q": "Carry out a binary LEFT shift by 1 place on 01010101. Enter the 8-bit result.", "type": "text", "answer": ["10101010"], "why": "01010101 shifted left by 1 place gives 10101010. A logical shift fills the vacated positions with 0."}, {"q": "Carry out a binary LEFT shift by 1 place on 11110011. Enter the 8-bit result.", "type": "text", "answer": ["11100110"], "why": "11110011 shifted left by 1 place gives 11100110. A logical shift fills the vacated positions with 0."}, {"q": "Carry out a binary LEFT shift by 2 places on 11001101. Enter the 8-bit result.", "type": "text", "answer": ["00110100"], "why": "11001101 shifted left by 2 places gives 00110100. A logical shift fills the vacated positions with 0."}, {"q": "Carry out a binary LEFT shift by 2 places on 01011001. Enter the 8-bit result.", "type": "text", "answer": ["01100100"], "why": "01011001 shifted left by 2 places gives 01100100. A logical shift fills the vacated positions with 0."}, {"q": "Carry out a binary LEFT shift by 1 place on 11011000. Enter the 8-bit result.", "type": "text", "answer": ["10110000"], "why": "11011000 shifted left by 1 place gives 10110000. A logical shift fills the vacated positions with 0."}, {"q": "Carry out a binary RIGHT shift by 1 place on 10100011. Enter the 8-bit result.", "type": "text", "answer": ["01010001"], "why": "10100011 shifted right by 1 place gives 01010001. A logical shift fills the vacated positions with 0."}, {"q": "Carry out a binary RIGHT shift by 2 places on 11111110. Enter the 8-bit result.", "type": "text", "answer": ["00111111"], "why": "11111110 shifted right by 2 places gives 00111111. A logical shift fills the vacated positions with 0."}, {"q": "Carry out a binary RIGHT shift by 2 places on 00111000. Enter the 8-bit result.", "type": "text", "answer": ["00001110"], "why": "00111000 shifted right by 2 places gives 00001110. A logical shift fills the vacated positions with 0."}, {"q": "Carry out a binary RIGHT shift by 3 places on 10101010. Enter the 8-bit result.", "type": "text", "answer": ["00010101"], "why": "10101010 shifted right by 3 places gives 00010101. A logical shift fills the vacated positions with 0."}, {"q": "Carry out a binary LEFT shift by 3 places on 10101010. Enter the 8-bit result.", "type": "text", "answer": ["01010000"], "why": "10101010 shifted left by 3 places gives 01010000. A logical shift fills the vacated positions with 0."}, {"q": "Carry out a binary RIGHT shift by 1 place on 11100010. Enter the 8-bit result.", "type": "text", "answer": ["01110001"], "why": "11100010 shifted right by 1 place gives 01110001. A logical shift fills the vacated positions with 0."}, {"q": "In a LEFT shift, which significant bit has a binary bit added, and what type of bit is added?", "type": "mcq", "answer": null, "why": "A logical left shift removes the MSB and inserts 0 at the LSB.", "opts": ["MSB and 0", "LSB and 0", "MSB and 1", "LSB and 1"], "correct": 1}, {"q": "In a RIGHT shift, which significant bit has a binary bit added, and what type of bit is added?", "type": "mcq", "answer": null, "why": "A logical right shift removes the LSB and inserts 0 at the MSB.", "opts": ["MSB and 0", "LSB and 0", "MSB and 1", "LSB and 1"], "correct": 0}, {"q": "In a RIGHT shift, which statements are correct?", "type": "mcq", "answer": null, "why": "A logical right shift inserts 0 at the MSB and removes the bit shifted out at the LSB.", "opts": ["MSB has a bit added", "LSB is removed from the binary number", "Both A and B", "Neither A nor B"], "correct": 2}, {"q": "In a LEFT shift, which statements are correct?", "type": "mcq", "answer": null, "why": "A logical left shift inserts 0 at the LSB and removes the bit shifted out at the MSB.", "opts": ["MSB has a bit added", "LSB is removed from the binary number", "LSB has a bit added and MSB is removed", "Neither A nor B"], "correct": 2}, {"q": "What does L stand for in LSB?", "type": "text", "answer": ["Least"], "why": "LSB means Least Significant Bit."}, {"q": "What does M stand for in MSB?", "type": "text", "answer": ["Most"], "why": "MSB means Most Significant Bit."}, {"q": "Which place value is associated with the MSB in an 8-bit unsigned binary number?", "type": "mcq", "answer": null, "why": "The MSB is the leftmost bit and has place value 128.", "opts": ["1", "128", "64", "16"], "correct": 1}, {"q": "Which place value is associated with the LSB in an 8-bit unsigned binary number?", "type": "mcq", "answer": null, "why": "The LSB is the rightmost bit and has place value 1.", "opts": ["1", "128", "64", "16"], "correct": 0}, {"q": "In the binary number 10011010, identify the MSB.", "type": "text", "answer": ["1"], "why": "The MSB is the leftmost bit, which is 1."}, {"q": "In the binary number 10011010, identify the LSB.", "type": "text", "answer": ["0"], "why": "The LSB is the rightmost bit, which is 0."}, {"q": "In the binary number 01001101, identify the MSB.", "type": "text", "answer": ["0"], "why": "The MSB is the leftmost bit, which is 0."}, {"q": "In the binary number 01001101, identify the LSB.", "type": "text", "answer": ["1"], "why": "The LSB is the rightmost bit, which is 1."}, {"q": "Identify the MSB and LSB in 01111111. Enter your answer as: MSB LSB.", "type": "text", "answer": ["0 1"], "why": "The leftmost bit is the MSB (0); the rightmost bit is the LSB (1)."}, {"q": "Identify the MSB and LSB in 01101110. Enter your answer as: MSB LSB.", "type": "text", "answer": ["0 0"], "why": "The leftmost bit is the MSB (0); the rightmost bit is the LSB (0)."}, {"q": "Identify the MSB and LSB in 11101011. Enter your answer as: MSB LSB.", "type": "text", "answer": ["1 1"], "why": "The leftmost bit is the MSB (1); the rightmost bit is the LSB (1)."}];
questions.forEach(q=>{if(q.type==="mcq"){q.shuffled=q.opts.map((t,i)=>({t,correct:i===q.correct}));for(let i=q.shuffled.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[q.shuffled[i],q.shuffled[j]]=[q.shuffled[j],q.shuffled[i]]}}});
let index=0,answers=Array(questions.length).fill(null),checked=Array(questions.length).fill(false);const $=id=>document.getElementById(id);
function norm(s){return String(s??"").trim().toLowerCase().replace(/₂/g,"2").replace(/\s+/g," ").replace(/[^a-z0-9 ]/g,"")}
function isCorrect(q,a){if(q.type==="mcq")return q.shuffled[a]?.correct===true;return (q.answer||[]).some(x=>norm(x)===norm(a))}
function render(){let q=questions[index];$("progress").textContent=`Question ${index+1} of ${questions.length}`;$("answered").textContent=`Answered: ${answers.filter(v=>v!==null&&v!=="").length}`;$("fill").style.width=((index+1)/questions.length*100)+"%";$("qnum").textContent=`QUESTION ${index+1}`;$("question").textContent=q.q;$("qtype").textContent=q.type==="mcq"?"Multiple choice":"Written answer";let area=$("area");area.innerHTML="";
if(q.type==="mcq"){let list=document.createElement("div");list.className="options";q.shuffled.forEach((o,i)=>{let el=document.createElement("div");el.className="option"+(answers[index]===i?" selected":"");if(checked[index])el.className+=" "+(o.correct?"correct":answers[index]===i?"wrong":"");el.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}.</span><span></span>`;el.children[1].textContent=o.t;el.onclick=()=>{if(!checked[index]){answers[index]=i;render()}};list.appendChild(el)});area.appendChild(list)}
else{let ta=document.createElement("textarea");ta.placeholder="Type your answer here...";ta.value=answers[index]||"";ta.disabled=checked[index];ta.oninput=()=>{answers[index]=ta.value;$("answered").textContent=`Answered: ${answers.filter(v=>v!==null&&v!=="").length}`};area.appendChild(ta);let hint=document.createElement("p");hint.className="small";hint.textContent="Enter your answer, then select Check answer to see the expected answer and explanation.";area.appendChild(hint)}
let fb=$("feedback");fb.className="feedback"+(checked[index]?" show":"");fb.innerHTML="";if(checked[index]){let ok=isCorrect(q,answers[index]);fb.classList.add(ok?"good":"note");let expected=q.type==="mcq"?q.shuffled.find(o=>o.correct).t:q.answer.join(" / ");fb.innerHTML=`<h3>${ok?"Correct!":"Review the expected answer."}</h3><p><b>Expected answer: ${expected}</b></p><p>${q.why}</p>`}
$("prev").disabled=index===0;$("next").textContent=index===questions.length-1?"Finish →":"Next →";$("check").disabled=checked[index];$("check").textContent=checked[index]?"Checked":"Check answer"}
$("prev").onclick=()=>{if(index>0){index--;render()}};$("next").onclick=()=>{if(index<questions.length-1){index++;render()}else results()};$("check").onclick=()=>{if(answers[index]===null||String(answers[index]).trim()===""){alert(questions[index].type==="mcq"?"Please select an answer first.":"Please enter an answer first.");return}checked[index]=true;render()};
function results(){$("quiz").style.display="none";let r=$("result");r.style.display="block";let score=0;questions.forEach((q,i)=>{if(checked[i]&&isCorrect(q,answers[i]))score++});let out=`<h2>Quiz completed!</h2><div class="score">${score} / ${questions.length}</div><p>Auto-marked answers. Review the explanations below.</p><p class="small">Answered ${answers.filter(v=>v!==null&&v!=="").length} of ${questions.length} questions.</p><hr>`;questions.forEach((q,i)=>{let ok=answers[i]!==null&&isCorrect(q,answers[i]);let expected=q.type==="mcq"?q.shuffled.find(o=>o.correct).t:q.answer.join(" / ");let yours=q.type==="mcq"?(answers[i]===null?"Not answered":q.shuffled[answers[i]].t):(answers[i]??"Not answered");out+=`<div class="review"><b>Q${i+1} · ${ok?"Correct":"Review"}</b><p>${q.q}</p><p>Your answer: ${yours}<br>Expected answer: ${expected}</p><p>${q.why}</p></div>`});out+=`<button class="primary" onclick="location.reload()">Retake quiz</button>`;r.innerHTML=out}render();
</script></body></html>
